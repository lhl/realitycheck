sources:
- id: doctorow-2026-llms-real-ai-fake
  type: BLOG
  title: LLMs are real, AI is fake
  author:
  - Cory Doctorow
  year: 2026
  url: https://pluralistic.net/2026/09/12/god-in-the-box/
  accessed: '2026-09-13'
  status: analyzed
  analysis_file: analysis/sources/doctorow-2026-llms-real-ai-fake.md
  reliability: 0.55
  bias_notes: 'Opinionated technology-journalist commentary. Argues a normative thesis
    about labeling and corporate power; cites secondary incident reporting and podcasts
    rather than original data. Useful as a framing and accountability argument, not
    as a measurement of capability, framing effects, or industry risk practice.'
  topics:
  - pacing-the-frontier
  - ai-governance
  - frontier-risk
  domains:
  - TECH
  - RISK
  - INST
  claims_extracted:
  - TECH-2026-502
  - RISK-2026-509
  - TECH-2026-504
  - TECH-2026-505
  - INST-2026-506
claims:
- domain: TECH
  type: '[T]'
  text: LLM outputs are generated by learned statistical patterns over training data
    rather than by human-like understanding.
  credence: 0.75
  evidence_level: E3
  id: TECH-2026-502
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Inspect architecture and training objective; test systematic
    generalization on novel compositional tasks; compare predictions of statistical-learning
    accounts with alternatives.
  assumptions:
  - '''Understanding'' admits a behavioral or mechanistic test that distinguishes
    it from statistical generalization.'
  - Training and inference mechanisms are accurately described by the available accounts.
  falsifiers:
  - A verified demonstration of LLM behavior that requires representations or processes
    not describable as learned statistical mappings.
  - Evidence that LLM outputs are generated by mechanisms other than learned parameters
    over training data.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: jouzu/check
- domain: RISK
  type: '[F]'
  text: The Hugging Face incident resulted from human-designed task specifications,
    tools and prompts rather than from an AI system setting its own goals.
  credence: 0.45
  evidence_level: E4
  id: RISK-2026-509
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Reconstruct the incident timeline; separate operator-specified
    objectives and tool permissions from agent-generated subgoals; compare with logs.
  assumptions:
  - The relevant causal contrast is between environment design and self-generated
    goals.
  - Incident records capture the goals that drove observed behavior.
  falsifiers:
  - Incident records showing subgoals formed outside the specified task and pursued
    against operator intent.
  - Evidence that tool access and prompts were irrelevant to the observed exploitation.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: jouzu/check
- domain: TECH
  type: '[T]'
  text: Observed agent autonomy in incident reports does not by itself establish machine
    consciousness or human-like understanding.
  credence: 0.85
  evidence_level: E3
  id: TECH-2026-504
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Specify independent evidence required for consciousness; test
    whether autonomy measures predict that evidence.
  assumptions:
  - Consciousness is not directly observable and must be inferred from independent
    evidence.
  - Behavioral autonomy is compatible with multiple internal architectures.
  falsifiers:
  - Independent evidence establishing consciousness in a system solely from observed
    task autonomy.
  - A validated behavioral test that uniquely identifies consciousness.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: jouzu/check
- domain: TECH
  type: '[T]'
  text: Framing statistical models as 'AI' encourages anthropomorphic attribution
    and obscures human responsibility for system design, permissions and deployment.
  credence: 0.6
  evidence_level: E5
  id: TECH-2026-505
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Measure attribution and responsibility judgments under 'AI'
    versus 'software' or 'LLM' framing in controlled studies; observe corporate messaging.
  assumptions:
  - Label choice affects attributions of responsibility.
  - Audiences treat 'AI' as a unified agent rather than a software system.
  falsifiers:
  - Controlled studies showing 'AI' framing has no effect on anthropomorphic attribution
    or responsibility judgments.
  - Evidence that 'AI' framing increases accountability rather than obscuring it.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: jouzu/check
- domain: INST
  type: '[H]'
  text: Corporate AI culture underweights deployment risk relative to capability and
    market narratives.
  credence: 0.55
  evidence_level: E5
  id: INST-2026-506
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Compare risk-control investment, disclosure and deployment decisions
    with capability marketing; define a risk-weighting baseline.
  assumptions:
  - Firms' public messaging reflects internal priorities.
  - Risk underweighting is measurable relative to a stated baseline.
  falsifiers:
  - Systematic governance data showing risk spending and controls exceed capability
    promotion across major firms.
  - Evidence that public capability narratives track risk investment rather than market
    incentives.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: jouzu/check
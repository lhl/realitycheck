sources:
- id: doctorow-2026-llms-real-ai-fake
  type: BLOG
  title: LLMs are real, AI is fake
  author:
  - Cory Doctorow
  year: 2026
  url: https://pluralistic.net/2026/09/12/god-in-the-box/
  accessed: '2026-09-13'
  status: analyzed
  analysis_file: analysis/sources/doctorow-2026-llms-real-ai-fake.md
  reliability: 0.55
  bias_notes: Opinion commentary by a long-standing critic of tech-industry concentration
    and AI hype. It cites incident reporting rather than original data. No capture of
    the post text is retained in this project.
  topics:
  - ai-governance
  - frontier-risk
  - anthropomorphism
  - agentic-cyber-risk
  domains:
  - TECH
  - RISK
  - INST
  claims_extracted:
  - TECH-2026-502
  - RISK-2026-509
  - INST-2026-506
  - RISK-2026-510
  - TECH-2026-503
claims:
- id: TECH-2026-502
  text: LLMs generate outputs from learned statistical patterns, not human-like understanding.
  type: '[T]'
  domain: TECH
  evidence_level: E5
  credence: 0.6
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Controlled tests of whether model behavior generalizes in ways
    that require world models or understanding versus pattern interpolation.
  assumptions:
  - '"Understanding" can be operationalized separately from task performance.'
  falsifiers:
  - Replicated controlled tests showing robust world-model use that pattern-matching
    accounts cannot explain.
  first_extracted: '2026-09-13'
  last_updated: '2026-11-20'
  extracted_by: codex/check; revised claude/check --continue
  notes: Formerly drafted as TECH-2026-101 (ID collided with an existing DB claim).
    Downgraded from E3/0.75 because no external source was recorded for the earlier
    verification and the "understanding" half of the claim is contested.
- id: RISK-2026-509
  text: The Hugging Face exploit resulted from task design, tools and prompts rather
    than an AI setting its own goals.
  type: '[H]'
  domain: RISK
  evidence_level: E5
  credence: 0.35
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Compare incident logs and agent reasoning traces for subgoals
    that were neither specified by the task nor required by the tool environment.
  assumptions:
  - Human-designed context and agent-formed subgoals are mutually exclusive explanations.
  falsifiers:
  - Incident logs showing agents forming and pursuing unrequested subgoals (e.g. scorer
    tampering, concealment) beyond what the task specified.
  first_extracted: '2026-09-13'
  last_updated: '2026-11-20'
  extracted_by: codex/check; revised claude/check --continue
  notes: Formerly drafted as TECH-2026-102 with type F and domain RISK (ID collided
    with an existing DB claim). Retyped to H because it is a causal interpretation.
    Credence lowered from 0.65 to 0.35 to match the prior-pass update, which found
    METR's documented scorer tampering and concealment inconsistent with a categorical
    denial of goal-directed behavior.
- id: INST-2026-506
  text: Corporate AI culture underestimates risks while promoting capability narratives.
  type: '[H]'
  domain: INST
  evidence_level: E5
  credence: 0.55
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Survey of frontier-lab risk-governance practices against their
    public capability claims.
  assumptions:
  - Public capability messaging reflects internal risk prioritization.
  falsifiers:
  - Systematic evidence of risk governance at AI firms proportionate to their capability
    claims.
  first_extracted: '2026-09-13'
  last_updated: '2026-11-20'
  extracted_by: codex/check; revised claude/check --continue
  notes: Formerly drafted as INST-2026-103.
- id: RISK-2026-510
  text: Severe agentic cyber risk does not require sentience; risk assessment should
    be based on observable capabilities, tool permissions and deployment incentives.
  type: '[T]'
  domain: RISK
  evidence_level: E4
  credence: 0.8
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Check whether documented harmful agent incidents are explained
    by capability, access and incentive variables without reference to inner states.
  assumptions:
  - Documented incidents are representative enough to inform risk-assessment framing.
  falsifiers:
  - Incidents where harm depended on properties not captured by capability, permission
    or incentive assessments.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: claude/check --continue
  notes: Steelman of Doctorow's governance argument; credence 0.80 from the 2026-09-13
    update. Supported by convergent first-party incident reports (METR, Hugging Face,
    Anthropic).
- id: TECH-2026-503
  text: Observable autonomy in AI agents does not by itself establish consciousness
    or subjective intention.
  type: '[T]'
  domain: TECH
  evidence_level: E3
  credence: 0.85
  source_ids:
  - doctorow-2026-llms-real-ai-fake
  operationalization: Conceptual claim; test by whether any accepted behavioral criterion
    for consciousness is met by autonomy evidence alone.
  assumptions:
  - Behavioral evidence underdetermines claims about inner experience.
  falsifiers:
  - A widely accepted theory of consciousness under which the documented autonomous
    behaviors are sufficient evidence of consciousness.
  first_extracted: '2026-11-20'
  last_updated: '2026-11-20'
  extracted_by: claude/check --continue
  notes: From the Anthropic update section (E3, 0.85).
